<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            height: 100vh;
            background-image: url('backgroundimage.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            font-style: system;
        }
        /* Adding an overlay for better text readability */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Dark overlay */
            z-index: -1; /* Ensure it stays behind content */
        }
        .headcontainer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 600px;
            font-size: 30px;
            color: white;
        }
        .navbar div {
            cursor: pointer;
        }
        .bottomcontainer {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            color: aliceblue;
            height: 500px;
            align-items: center;
            font-size: 40px;
        }
        .twominicontainers {
            display: flex;
            gap: 50px;
        }
        button {
            height: 50px;
            width: 200px;
            border-radius: 40px;
            color: white;
            background-color: red;
            border: none;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease; /* Smooth transition */
        }
        /* Hover effect */
        button:hover {
            transform: scale(1.1); /* Slightly larger */
            background-color: black;
            
        }
        /* For specific explore more button */
        .exploremore:hover {
            background-color: black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="headcontainer">
            <img class="cascadelogo" src="cascade-3.svg" height="100px"></img>
            <div class="navbar">
                <div class="home">Home</div>
                <div class="about">About</div>
                <div class="services">Services</div>
                <div class="contact">Contact</div>
                <div class="feedback">Feedback</div>
            </div>
        </div>
        <div class="bottomcontainer">
            <div class="text"><h1>Welcome to CSS</h1></div>
            <div class="twominicontainers">
                <button class="exploremore">Explore More</button>
                <button class="subscribeus">Subscribe Us</button>
            </div>
        </div>
    </div>
</body>
</html>
