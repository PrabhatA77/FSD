<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical</title>
    <style>
        .repeat{
            background-image: url(WhatsApp\ Image\ .jpg);
            background-repeat: repeat;
            height: 200px;
            width: 400px;
            border: 2px solid #000;
            background-size: cover;
            background-position: center;
        }
        .repeat-x{
            background-image: url(WhatsApp\ Image\ .jpg);
            background-repeat: repeat-x;
            height: 200px;
            width: 400px;
            border: 2px solid #000;
            background-size: cover;
            background-position: center;
        }
        .repeat-y{
            background-image: url(WhatsApp\ Image\ .jpg);
            background-repeat: repeat-y;
            height: 200px;
            width: 400px;
            border: 2px solid #000; 
            background-size: cover; 
            background-position: center;

        }
        .no-repeat{
            background-image: url(WhatsApp\ Image\ .jpg);
            background-repeat: no-repeat;
            height: 200px;
            width: 400px;
            border: 2px solid #000;
            background-size: cover;background-position: center;
        }
    </style>
</head>
<body>
    <h2 align="center"> CSS Background Repeat Examples</h2>
    <h2>repeat</h2><div class="repeat"></div>
    <h2>repeat-x</h2><div class="repeat-x"></div>
    <h2>repeat-y</h2><div class="repeat-y"></div>
    <h2>no-repeat</h2><div class="no-repeat"></div>
</body>
</html>
