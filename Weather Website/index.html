<body>
    <div class="container">
        <!--for left side -->
        <div class="leftcontainer">
            
            <!-- search section -->
            <div class="search-container">
                
                <form class="search-box" id="searchbox">
                    <input 
                    type="text"
                    placeholder="Search your city here"  class="city_name"
                    id="searchhere">
                </form>
                <!-- <button class="search-btn">Search</button> -->
            </div>



            <div class="mainweatherdetails">
                <!--main weather -->
                <div class="mainweather">
                    <i class="weathericon"
                    id="weathericon">weather icon</i>
                    <div class="weatherreport">
                        <div id="weathertemp" class="temperature">temperature</div>
                        <div class="weathertext" id="Weatherforecast">weather text</div>
                    </div>
                </div>

                <div class="line"></div>

                <!-- date,time and place -->
                <div class="placedateandtime">
                    <div class="dateandtime" id="dateandtime">date and time</div>
                    <div class="place" id="place">location</div>
                </div>
            </div>
        </div>

        <!-- for right side -->

        <div class="rightcontainer">
            <div class="today">
                <b>TODAY</b>
            </div>
            <div class="weatherdetails">

            
            <div class="firstrow">

                <div class="wind">
    
                    <b>
                        <!-- <img src="wind.png" style="height: 15px; width: 15px;" alt=""> -->
                        Wind
                    </b>
                    <p id="wind">6 Km/h</p>
    
                </div>
                <div class="humidity">
                    <b>
                        <!-- <img src="humidity.png" style="height: 16px;" alt=""> -->
                        Humidity
                    </b>
                    <p id="humidity">34</p>
                </div>
            </div>


            <div class="secondrow">

                <div class="realfeel">
                    <b>
                        <!-- <img src="thermometer.png" style="height: 16px;" alt=""> -->
                        Feels like
                    </b>
                    <p id="realfeel">31&#176</p>
                </div>
                <!-- <div class="uvindex">UV Index</div> -->
                <div class="pressure">
                    <b>
                        <!-- <img src="pressure.png" style="height: 16px;" alt=""> -->
                        Pressure</b>
                    <p id="pressure">686 hPa</p>
                </div>
            </div>


            <div class="thirdrow">

                <div class="mintemp">
                    <b>
                    <!-- <img src="down-arrow.png" style="height: 16px;" alt=""> -->
                        Min:Temp
                    </b>
                    <p id="mintemp">31&#176</p>
                </div>
                <div class="maxtemp">
                    <b>
                        <!-- <img src="up-arrow.png" style="height: 16px;" alt=""> -->
                        Max:Temp
                    </b>
                    <p id="maxtemp">31&#176</p>
                </div>
            </div>
            <!-- <div class="chanceofrain">Chance of rain</div> -->
        </div>
        </div>

    </div>
</body>
<script>
     let cityName = document.getElementById("place");
     let dateTime = document.getElementById("dateandtime");
     let w_forecast = document.getElementById("Weatherforecast");
     let w_temperature = document.getElementById("weathertemp");
     let w_icon = document.getElementById("weathericon");
     let w_minTem = document.getElementById("mintemp");
     let w_maxTem = document.getElementById("maxtemp");
     let w_feelsLike = document.getElementById("realfeel");
     let w_humidity = document.getElementById("humidity");
     let w_pressure = document.getElementById("pressure");
     let w_wind = document.getElementById("wind");

     let w_search = document.getElementById("searchbox");

     //to get the actual country name
    const getcountryname = (code) => {
        return new Intl.DisplayNames([code], { type: 'region' }).of(code);
    }

    //to get the actual date and time
    const getDateTime = (dt) => {
        // let dt = 1708667988;
        const curDate = new Date(dt*1000);
        console.log(curDate);

        const options = {
            weekday: "long",
            year: "numeric",
            month:"long",
            day:"numeric",
            hour:"numeric",
            minute:"numeric",
        };

        const formatter = new Intl.DateTimeFormat("en-US",options);

        return formatter.format(curDate);
    }

    //converting fahreheit to celcius
    const gettempincelcius = (kelvin) => {
        const celsius = kelvin - 273.15;
        return celsius.toFixed(2);
    }

    let city = "Ghaziabad";
    //search functionality
     w_search.addEventListener("submit",(e) => {
        e.preventDefault();

        let cityname = document.getElementById("searchhere");
        city = cityname.value;

        getWeatherData();

        cityname.value = "";
     })

    const getWeatherData = async () => {
        const weatherURL = `https://api.openweathermap.org/data/2.5/weather?q=${city}&APPID=e46418c665b4d98aa0e25dd97670463a`;
        try {
            const res = await fetch(weatherURL);
            const data = await res.json();
            console.log(data);

            const {main,name,weather,wind,sys,dt} = data;

            cityName.innerHTML = `${name}, ${getcountryname(sys.country)}`;

            dateTime.innerHTML = getDateTime(dt);

            w_temperature.innerHTML = `${gettempincelcius(main.temp)}&#176C`;

            w_minTem.innerHTML = `${gettempincelcius(main.temp_min)}&#176C`;
            w_maxTem.innerHTML = `${gettempincelcius(main.temp_max)}&#176C`;
            w_feelsLike.innerHTML = main.feels_like;
            w_humidity.innerHTML = `${main.humidity} %`;
            w_pressure.innerHTML = `${main.pressure} hPa`;
            w_wind.innerHTML = `${wind.speed} m/s`;

            w_icon.innerHTML = `<img style="height:100px;width:100px;" src="http://openweathermap.org/img/wn/${weather[0].icon}@4x.png" />`;
            w_forecast.innerHTML = weather[0].main;

        } catch (error) {
            console.log(error);
        }
    };

     document.body.addEventListener("load",getWeatherData());

</script>

</html>
